<!DOCTYPE html>
<html lang="de">
<head>

<title>Beerpong-Weihnachtsturnier · Gruppe Timmer</title>
<style>

html,body{margin:0}

body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;min-height:100vh;-webkit-tap-highlight-color:transparent;
background:radial-gradient(1100px 600px at 8% -12%,rgba(38,128,92,.35),transparent 60%),radial-gradient(800px 500px at 108% 0%,rgba(217,180,90,.09),transparent 60%),linear-gradient(180deg,var(--g900),var(--g950))}
.serif,h1,h2,h3{font-family:Georgia,"Palatino Linotype","Book Antiqua",serif}
header.top,nav,main{position:relative;z-index:1}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px 18px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:14px;opacity:.95;background-size:56px 14px;background-repeat:repeat-x;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='14' viewBox='0 0 56 14'><g stroke='%233f9a70' stroke-width='1.6' stroke-linecap='round'><path d='M0 7h56'/><path d='M6 7l-4-5M6 7l-4 5M14 7l-4-5M14 7l-4 5M22 7l-4-5M22 7l-4 5M30 7l-4-5M30 7l-4 5M38 7l-4-5M38 7l-4 5M46 7l-4-5M46 7l-4 5M54 7l-4-5M54 7l-4 5'/></g><circle cx='26' cy='7' r='2.2' fill='%23c0392b'/><circle cx='50' cy='7' r='1.6' fill='%23ffffff'/></svg>")}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:84px;height:100px;flex:none;display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.logo img,.logo svg{width:100%;height:100%;object-fit:contain}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.sub{color:var(--muted);font-size:14px}

.spacer{flex:1}
main{padding:18px 24px 70px;max-width:1400px;margin:0 auto}
.card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-size:20px;margin:0 0 12px}
.card h3{font-size:16px;margin:16px 0 8px}
.grid{display:grid;gap:16px;align-content:start}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(max-width:900px){.g2{grid-template-columns:1fr}}

.btn:active{transform:translateY(1px)}
.btn.primary{background:#fff;color:var(--g900);border-color:#fff}
.btn.gold{background:var(--gold);color:#1d1606;border-color:var(--gold)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tlabel{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);display:flex;justify-content:space-between;gap:8px}

.kg .ln+.ln{border-top:1px solid var(--line)}
.sched{display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.sched span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.sched span:nth-child(odd){color:var(--muted)}
.hero{text-align:center;padding:36px 20px}
.hero .herologo{height:240px;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.hero .big{font-family:Georgia,serif;font-size:46px;font-weight:700;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.05)}
ol.rules{margin:0;padding-left:24px;line-height:1.55;font-size:17px}
ol.rules li{margin-bottom:10px;padding-left:4px}
.foot{margin-top:16px;color:var(--muted);font-size:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:var(--g900);padding:12px 18px;border-radius:12px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90vw;text-align:center}

body.tv table.st{font-size:19px}
body.tv h1{font-size:38px}
body.tv .logo{width:106px;height:126px}

<body>

  <div class="brand">
    <div class="logo" id="logo"></div>

      <div class="eyebrow">Landgemeinde Bauernschützen e.V. · Gruppe Timmer</div>

<script>
(function(){
"use strict";
const KEY='bierpong-gruppe-timmer-2026';
const DEFAULT_RULES=[
 'Gespielt wird zwei gegen zwei mit {becher} Bechern pro Seite.',
 'Schnick-Schnack-Schnuck entscheidet, welches Team zuerst wirft. Pro Runde wirft jeder Spieler eines Teams einen Ball.',
 'Balls Back: Treffen beide Spieler in derselben Runde zwei verschiedene Becher, bekommt das Team beide Bälle zurück und wirft noch einmal.',
 'Landen beide Bälle im selben Becher, gibt es ebenfalls Balls Back, und es werden drei Becher getrunken: der getroffene und zwei weitere.',
 'Ein Bouncer (der Ball springt vorher auf dem Tisch auf) zählt zwei Becher.',
 'Ellbogenregel: Beim Wurf bleibt der Ellbogen hinter der Tischkante. Ist er darüber, zählt der Treffer nicht.',
 'Nachwurf: Das Team, das als zweites geworfen hat, hat den Nachwurf. Trifft das Startteam den letzten Becher, darf das andere Team seine Runde noch zu Ende werfen. Gleicht es dabei aus, entscheidet das Stechen.',
 'Zeitlimit: Nach {zeit} Minuten wird die laufende Runde zu Ende gespielt. Danach gewinnt das Team mit mehr getroffenen Bechern.',
 'Stechen bei Gleichstand: Die Teams werfen abwechselnd je einen Ball. Trifft ein Team und das andere antwortet nicht mit einem Treffer, ist das Spiel entschieden.',
 'Wertung in der Tabelle: zuerst Siege, dann Becherdifferenz, dann getroffene Becher, dann der direkte Vergleich.',
 'Das Siegerteam des Finales bekommt den Pokal.'
];
function defState(){return{v:1,settings:{date:'2026-12-19',start:'20:00',cups:10,system:'groups',groupsMode:'auto',koStart:'HF',thirdPlace:true,leagueKO:'final',gameMin:12,pauseMin:3,limitOn:true,limitMin:12,tables:2,snow:true,sound:true},teams:[],drawn:false,groups:[],games:[],rules:DEFAULT_RULES.slice(),logo:null}}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
function normalize(x){const d=defState();if(!x||typeof x!=='object'||!x.settings)return d;x.settings=Object.assign(d.settings,x.settings);['teams','groups','games'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});if(!Array.isArray(x.rules)||!x.rules.length)x.rules=d.rules;x.drawn=!!x.drawn;return x}
S=normalize(S);
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('Speichern im Browser klappt hier nicht. Bitte zwischendurch ein Backup machen.')}}}
let view='live',tv=false,mstate=null,pendingConfirm=null,tcount=0;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>S.games.find(g=>g.id===id);
const team=id=>S.teams.find(t=>t.id===id);
const tname=id=>{const t=team(id);return t?(t.name||'Team ohne Namen'):'?'};
const players=id=>{const t=team(id);if(!t)return'';return[t.p1,t.p2].filter(x=>x&&x.trim()).join(' & ')};
const fmt=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const ROUND={VF:'Viertelfinale',HF:'Halbfinale',P3:'Spiel um Platz 3',F:'Finale'};
function baseTime(){const s=S.settings;const d=new Date((s.date||'2026-12-19')+'T00:00:00');const p=(s.start||'20:00').split(':');d.setHours(+p[0]||0,+p[1]||0,0,0);return d.getTime()}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}

/* ---------- Turnier erzeugen ---------- */
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roundRobin(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rounds=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pr.push(r%2?[y,x]:[x,y])}rounds.push(pr);a.splice(1,0,a.pop())}return rounds}
function groupCount(n,mode){if(n<4)return 0;if(String(mode)==='4')return n>=8?4:2;if(String(mode)==='3')return n>=9?3:2;if(String(mode)==='auto')return n>=12?4:2;return 2}
function groupSplit(n,mode){const G=groupCount(n,mode);if(!G)return null;const sz=Array(G).fill(0);for(let i=0;i<n;i++){const r=Math.floor(i/G);sz[r%2?G-1-(i%G):i%G]++}return sz}
function vfPossible(G,sz){const m=Math.min(...sz);return G===2?m>=4:G===3?m>=3:m>=2}
function generate(system,ids,s,doShuffle){
 const list=doShuffle?shuffled(ids):ids.slice();const games=[];let groups=[];
 const mk=o=>Object.assign({id:uid(),status:'open',hA:0,hB:0,win:null,table:null,startedAt:null,finishedAt:null,phase:'group'},o);
 const ko=(round,label,sa,sb,solo)=>{const g=mk({phase:'ko',round,label,sa,sb,solo:!!solo});games.push(g);return g};
 const W=g=>({type:'winner',game:g.id}),L=g=>({type:'loser',game:g.id});
 const fin=(a,b)=>ko('F','Finale',a,b,true);
 const semis=(a1,b1,a2,b2)=>{const h1=ko('HF','Halbfinale 1',a1,b1),h2=ko('HF','Halbfinale 2',a2,b2);if(s.thirdPlace)ko('P3','Spiel um Platz 3',L(h1),L(h2));fin(W(h1),W(h2))};
 if(system==='groups'){
  const G=groupCount(list.length,s.groupsMode),names='ABCD';
  groups=Array.from({length:G},(_,i)=>({key:names[i],name:G===1?'Gruppe':'Gruppe '+names[i],ids:[]}));
  list.forEach((id,i)=>{const r=Math.floor(i/G);const gi=r%2?G-1-(i%G):i%G;groups[gi].ids.push(id)});
  const rr=groups.map(g=>roundRobin(g.ids));const maxR=Math.max(...rr.map(x=>x.length));
  for(let r=0;r<maxR;r++)groups.forEach((g,gi)=>(rr[gi][r]||[]).forEach(p=>games.push(mk({group:g.key,label:g.name,sa:{type:'team',id:p[0]},sb:{type:'team',id:p[1]}}))));
  const R=(k,n)=>({type:'rank',group:k,rank:n});
  const B=(r,k)=>({type:'best',rank:r,nth:k});
  const qf=pairs=>{const v=pairs.map((p,i)=>ko('VF','Viertelfinale '+(i+1),p[0],p[1]));semis(W(v[0]),W(v[1]),W(v[2]),W(v[3]))};
  const vf=s.koStart==='VF'&&vfPossible(G,groups.map(g=>g.ids.length));
  if(G===2){if(vf)qf([[R('A',1),R('B',4)],[R('B',2),R('A',3)],[R('B',1),R('A',4)],[R('A',2),R('B',3)]]);else semis(R('A',1),R('B',2),R('B',1),R('A',2))}
  else if(G===3){const PK=(set,slot)=>({type:'pick',set,slot});if(vf)qf([[R('A',1),PK('q3vf',0)],[R('B',2),R('C',2)],[R('B',1),PK('q3vf',1)],[R('C',1),R('A',2)]]);else semis(PK('q3hf',0),PK('q3hf',1),PK('q3hf',2),R('C',1))}
  else{if(vf)qf([[R('A',1),R('B',2)],[R('C',1),R('D',2)],[R('B',1),R('A',2)],[R('D',1),R('C',2)]]);else semis(R('A',1),R('D',1),R('B',1),R('C',1))}
 }else{
  groups=[{key:'L',name:'Tabelle',ids:list}];
  roundRobin(list).forEach(r=>r.forEach(p=>games.push(mk({group:'L',label:'Jeder gegen jeden',sa:{type:'team',id:p[0]},sb:{type:'team',id:p[1]}}))));
  const R=n=>({type:'rank',group:'L',rank:n});
  if(s.leagueKO==='semis'&&list.length>=4)semis(R(1),R(4),R(2),R(3));
  else if(s.leagueKO!=='none'&&list.length>=2)fin(R(1),R(2));
 }
 return{groups,games};
}

/* ---------- Tabelle & Auflösung ---------- */
function standings(key){
 const grp=S.groups.find(g=>g.key===key);if(!grp)return[];
 const rows={};grp.ids.forEach(id=>rows[id]={id,sp:0,s:0,n:0,bp:0,bm:0});
 const gg=S.games.filter(g=>g.phase==='group'&&g.group===key&&g.status==='done');
 gg.forEach(g=>{const A=rows[g.sa.id],B=rows[g.sb.id];if(!A||!B)return;A.sp++;B.sp++;A.bp+=g.hA;A.bm+=g.hB;B.bp+=g.hB;B.bm+=g.hA;if(g.win==='a'){A.s++;B.n++}else{B.s++;A.n++}});
 const h2h=(x,y)=>{const g=gg.find(g=>(g.sa.id===x&&g.sb.id===y)||(g.sa.id===y&&g.sb.id===x));if(!g)return 0;const w=g.win==='a'?g.sa.id:g.sb.id;return w===x?-1:1};
 return Object.values(rows).sort((x,y)=>(y.s-x.s)||((y.bp-y.bm)-(x.bp-x.bm))||(y.bp-x.bp)||h2h(x.id,y.id)||tname(x.id).localeCompare(tname(y.id),'de'));
}
function groupDone(key){const gg=S.games.filter(g=>g.phase==='group'&&g.group===key);return gg.length>0&&gg.every(g=>g.status==='done')}
function resolve(src){
 if(!src)return null;
 if(src.type==='team')return src.id;
 if(src.type==='rank'){if(!groupDone(src.group))return null;const st=standings(src.group);return st[src.rank-1]?st[src.rank-1].id:null}
 if(src.type==='pick'){if(!S.groups.every(g=>groupDone(g.key)))return null;const r=pickSet(src.set);return r?(r[src.slot]||null):null}
 if(src.type==='best'){if(!S.groups.every(g=>groupDone(g.key)))return null;const c=S.groups.map(g=>standings(g.key)[src.rank-1]).filter(Boolean);c.sort((x,y)=>(y.s-x.s)||((y.bp-y.bm)-(x.bp-x.bm))||(y.bp-x.bp)||tname(x.id).localeCompare(tname(y.id),'de'));return c[src.nth-1]?c[src.nth-1].id:null}
 const g=byId(src.game);if(!g||g.status!=='done')return null;
 const a=resolve(g.sa),b=resolve(g.sb);const w=g.win==='a'?a:b,l=g.win==='a'?b:a;
 return src.type==='winner'?w:l;
}
function bestOf(rank){const c=S.groups.map(g=>{const r=standings(g.key)[rank-1];return r?Object.assign({g:g.key},r):null}).filter(Boolean);c.sort((x,y)=>(y.s-x.s)||((y.bp-y.bm)-(x.bp-x.bm))||(y.bp-x.bp)||tname(x.id).localeCompare(tname(y.id),'de'));return c}
function pickSet(set){
 if(set==='q3vf'){const t=bestOf(3);if(t.length<2)return null;let a=t[1],b=t[0];if(a.g==='A'||b.g==='B'){a=t[0];b=t[1]}return[a.id,b.id]}
 if(set==='q3hf'){const sec=bestOf(2)[0],a1=standings('A')[0],b1=standings('B')[0];if(!sec||!a1||!b1)return null;return sec.g==='A'?[b1.id,sec.id,a1.id]:[a1.id,sec.id,b1.id]}
 return null}
function srcLabel(src){if(src.type==='pick'){if(src.set==='q3vf')return'Bester oder zweitbester Gruppendritter';return src.slot===1?'Bester Gruppenzweiter':'Sieger Gruppe A oder B'}if(src.type==='team')return tname(src.id);if(src.type==='rank')return src.group==='L'?'Platz '+src.rank+' der Tabelle':(S.groups.length===1?'Platz '+src.rank:'Gruppe '+src.group+', Platz '+src.rank);if(src.type==='best'){const w=src.rank===2?'Gruppenzweiter':'Gruppendritter';return(src.nth===1?'Bester ':src.nth+'. bester ')+w}const g=byId(src.game);return(src.type==='winner'?'Sieger ':'Verlierer ')+(g?g.label:'')}
function side(g,s){const src=s==='a'?g.sa:g.sb;const id=resolve(src);return id?{id,name:tname(id),pl:players(id),known:true}:{id:null,name:srcLabel(src),pl:'',known:false}}
function qualifiers(key){let q=0;S.games.forEach(g=>[g.sa,g.sb].forEach(s=>{if(s&&s.type==='rank'&&s.group===key)q=Math.max(q,s.rank);if(s&&s.type==='pick'&&s.set==='q3hf'&&(key==='A'||key==='B'))q=Math.max(q,1)}));return q}
function dependents(g){return S.games.filter(x=>x.phase==='ko'&&[x.sa,x.sb].some(s=>(s.game===g.id)||(g.phase==='group'&&((s.type==='rank'&&s.group===g.group)||s.type==='best'||s.type==='pick'))))}
function champion(){
 if(!S.drawn||!S.games.length)return null;
 const f=S.games.find(g=>g.round==='F');
 if(f)return f.status==='done'?resolve(f.win==='a'?f.sa:f.sb):null;
 if(S.games.every(g=>g.status==='done')){const st=standings(S.groups[0].key);return st[0]?st[0].id:null}
 return null;
}

/* ---------- Zeitplanung (passt sich live an) ---------- */
function project(games){
 const s=S.settings,slot=Math.max(1,+s.gameMin)*6e4,pause=Math.max(0,+s.pauseMin)*6e4,T=Math.max(1,+s.tables||2);
 const now=Date.now(),earliest=Math.max(baseTime(),now);
 const tf=Array(T).fill(earliest),tm={},end={},res={};
 const touch=(src,t)=>{if(src&&src.type==='team')tm[src.id]=Math.max(tm[src.id]||0,t)};
 games.forEach(g=>{if(g.status==='done'){end[g.id]=g.finishedAt;res[g.id]={start:g.startedAt||g.finishedAt,end:g.finishedAt,table:g.table}}});
 games.forEach(g=>{if(g.status==='live'){const e=Math.max(g.startedAt+slot,now);end[g.id]=e;res[g.id]={start:g.startedAt,end:e,table:g.table};const ti=Math.min(g.table||0,T-1);tf[ti]=Math.max(tf[ti],e+pause);touch(g.sa,e+pause);touch(g.sb,e+pause)}});
 const pend=games.filter(g=>g.status==='open');
 const dep=g=>{let t=0;for(const src of[g.sa,g.sb]){if(src.type==='team')continue;if(src.type==='rank'||src.type==='best'||src.type==='pick'){for(const x of games){if(x.phase==='group'&&(src.type!=='rank'||x.group===src.group)){if(end[x.id]==null)return null;t=Math.max(t,end[x.id]+pause)}}}else{if(end[src.game]==null)return null;t=Math.max(t,end[src.game]+pause)}}return t};
 let guard=0;
 while(pend.length&&guard++<1000){
  let ti=0;tf.forEach((v,i)=>{if(v<tf[ti])ti=i});
  let best=null;
  pend.forEach((g,i)=>{const d=dep(g);if(d==null)return;let st=Math.max(tf[ti],d,g.sa.type==='team'?(tm[g.sa.id]||0):0,g.sb.type==='team'?(tm[g.sb.id]||0):0);if(g.solo)st=Math.max(st,...tf);if(!best||st<best.st)best={g,i,st}});
  if(!best)break;
  const e=best.st+slot;end[best.g.id]=e;res[best.g.id]={start:best.st,end:e,table:ti,proj:true};
  if(best.g.solo)tf.fill(e+pause);else tf[ti]=e+pause;
  touch(best.g.sa,e+pause);touch(best.g.sb,e+pause);pend.splice(best.i,1);
 }
 const ends=Object.values(res).map(r=>r.end);
 return{res,last:ends.length?Math.max(...ends):earliest};
}
function compare(sys){
 const n=S.teams.length;if(n<3||(sys==='groups'&&n<4))return null;
 const ids=Array.from({length:n},(_,i)=>'x'+i);
 const g=generate(sys,ids,Object.assign({},S.settings,{system:sys}),false);
 const keep={games:S.games};const pr=project(g.games);void keep;
 const sizes=g.groups.map(x=>x.ids.length);
 return{games:g.games.length,ko:g.games.filter(x=>x.phase==='ko').length,groups:g.groups.length,min:Math.min(...sizes)-1,max:Math.max(...sizes)-1,end:pr.last};
}

function liveIds(){const s=new Set();S.games.forEach(x=>{if(x.status==='live'){[resolve(x.sa),resolve(x.sb)].forEach(i=>i&&s.add(i))}});return s}
function canStart(g){
 if(!g||g.status!=='open')return'Dieses Spiel ist nicht offen.';
 const a=resolve(g.sa),b=resolve(g.sb);if(!a||!b)return'Die Teams für dieses Spiel stehen noch nicht fest.';
 const live=S.games.filter(x=>x.status==='live');if(live.length>=S.settings.tables)return'Alle Tische sind belegt.';
 const li=liveIds();if(li.has(a)||li.has(b))return'Ein Team steht gerade noch am anderen Tisch.';
 if(g.solo&&live.length)return'Das Finale startet erst, wenn alle Tische frei sind.';
 return null;
}
function startGame(id,table){
 const g=byId(id);const err=canStart(g);if(err){toast(err);return}
 const used=new Set(S.games.filter(x=>x.status==='live').map(x=>x.table));
 let t=(table!=null&&!used.has(+table))?+table:0;while(used.has(t))t++;
 g.table=t;g.status='live';g.startedAt=Date.now();g.beeped=false;save();render();
}
function openResult(id){
 const g=byId(id);if(!g)return;const A=side(g,'a'),B=side(g,'b');
 if(!A.known||!B.known){toast('Die Teams für dieses Spiel stehen noch nicht fest.');return}
 mstate={id,hA:g.status==='done'?g.hA:0,hB:g.status==='done'?g.hB:0,win:g.status==='done'?g.win:null};drawResult();
}
function stepper(s,p,val,c){return`<div class="stp"><div class="stn">${esc(p.name)}${p.pl?`<div class="pl">${esc(p.pl)}</div>`:''}</div><div class="step"><button class="btn big" data-act="mstep" data-side="${s}" data-d="-1" aria-label="weniger">&minus;</button><div class="n">${val}</div><button class="btn big" data-act="mstep" data-side="${s}" data-d="1" aria-label="mehr">+</button><button class="btn sm" data-act="mfull" data-side="${s}">Alle ${c}</button></div></div>`}
function drawResult(){
 const g=byId(mstate.id),A=side(g,'a'),B=side(g,'b'),c=S.settings.cups,tie=mstate.hA===mstate.hB;
 const warn=g.status==='done'&&dependents(g).some(x=>x.status!=='open')?'<p class="note">Achtung: Folgespiele haben schon begonnen. Eine Änderung kann die Paarungen dort nicht mehr verschieben.</p>':'';
 modal(`<div class="tag">${esc(g.label)}</div><h2>Ergebnis eintragen</h2><div class="sub" style="margin-bottom:8px">Getroffene Becher je Team (höchstens ${c})</div>

 ${tie?`<div class="tiebox"><div style="margin-bottom:10px">Gleichstand. Wer hat das Stechen gewonnen?</div><div class="row"><button class="btn ${mstate.win==='a'?'primary':''}" data-act="mwin" data-v="a">${esc(A.name)}</button><button class="btn ${mstate.win==='b'?'primary':''}" data-act="mwin" data-v="b">${esc(B.name)}</button></div></div>`:''}
 ${warn}<div class="row mfoot">${g.status==='done'?'<button class="btn danger" data-act="mreset">Ergebnis löschen</button>':''}<span class="spacer"></span><button class="btn" data-act="mclose">Abbrechen</button><button class="btn primary" data-act="msave">Speichern</button></div>`);
}
function saveResult(){
 const g=byId(mstate.id);const tie=mstate.hA===mstate.hB;
 if(tie&&!mstate.win){toast('Bei Gleichstand bitte den Sieger aus dem Stechen auswählen.');return}
 g.hA=mstate.hA;g.hB=mstate.hB;g.win=tie?mstate.win:(mstate.hA>mstate.hB?'a':'b');
 const now=Date.now();if(g.status!=='done'){g.finishedAt=now;if(!g.startedAt)g.startedAt=now}
 g.status='done';closeModal();save();render();
 const f=S.games.find(x=>x.round==='F');if(f&&f.id===g.id)toast('Wir haben einen Pokalsieger!');
}
function resetResult(){
 const g=byId(mstate.id);if(dependents(g).some(x=>x.status!=='open')){toast('Erst die Ergebnisse der Folgespiele löschen.');return}

function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML='';mstate=null;pendingConfirm=null}

function audio(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){try{audio();if(!ac)return;const t0=ac.currentTime+.05;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=6;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.1;comp.connect(ac.destination);
 const out=ac.createGain();out.gain.value=1.6;out.connect(comp);
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=.8;lp.connect(out);
 const sh=ac.createWaveShaper();const cv=new Float32Array(2048);for(let i=0;i<2048;i++){const x=i/1024-1;cv[i]=Math.tanh(4*x)}sh.curve=cv;sh.oversample='4x';sh.connect(lp);
 const blasts=[[0,.5],[.7,.5],[1.4,1.6]];
 blasts.forEach(b=>{const st=t0+b[0],d=b[1];
  [[349,0],[352,0],[440,-.35],[523,-.5],[698,-.7]].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';
   o.frequency.setValueAtTime(f[0]*.86,st);o.frequency.exponentialRampToValueAtTime(f[0],st+.06);
   const v=.32*Math.pow(10,f[1]);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(v,st+.025);g.gain.setValueAtTime(v,st+d-.06);g.gain.exponentialRampToValueAtTime(.0001,st+d);
   o.connect(g).connect(sh);o.start(st);o.stop(st+d+.02)})})}catch(e){}}

function liveCard(g,t){

function suggestions(P){
 const li=liveIds();const used=new Set();
 return S.games.filter(g=>g.status==='open').filter(g=>{const a=resolve(g.sa),b=resolve(g.sb);return a&&b&&!li.has(a)&&!li.has(b)}).sort((x,y)=>(P[x.id]?P[x.id].start:9e15)-(P[y.id]?P[y.id].start:9e15)).filter(g=>{const a=resolve(g.sa),b=resolve(g.sb);if(used.has(a)||used.has(b))return false;used.add(a);used.add(b);return true});

 }
 h+='</div>';
 const next=S.games.filter(g=>g.status==='open').sort((x,y)=>(P[x.id]?P[x.id].start:9e15)-(P[y.id]?P[y.id].start:9e15)).slice(0,6);
 const last=S.games.filter(g=>g.status==='done').sort((x,y)=>y.finishedAt-x.finishedAt).slice(0,5);
 const nextH=next.length?next.map(g=>{const A=side(g,'a'),B=side(g,'b'),p=P[g.id];return`<div class="it"><span class="time">${p?'ca. '+fmt(p.start):''}</span><span>${pName(A)} <span class="los">gegen</span> ${pName(B)}<div class="tag" style="margin-top:3px">${esc(g.label)}${p&&p.table!=null?' · Tisch '+(p.table+1):''}</div></span><span class="admin">${canStart(g)?'':`<button class="btn sm" data-act="start" data-id="${g.id}">Starten</button>`}</span></div>`}).join(''):'<div class="sub">Keine offenen Spiele mehr.</div>';
 const lastH=last.length?last.map(resLine).join(''):'<div class="sub">Noch keine Ergebnisse.</div>';

function resLine(g){const A=side(g,'a'),B=side(g,'b');const wa=g.win==='a';return`<div class="it"><span class="time">${fmt(g.finishedAt)}</span><span><span class="${wa?'win':'los'}">${esc(A.name)}</span> <span class="res">${g.hA} : ${g.hB}</span> <span class="${wa?'los':'win'}">${esc(B.name)}</span><div class="tag" style="margin-top:3px">${esc(g.label)}</div></span><span class="admin"><button class="btn sm" data-act="result" data-id="${g.id}">Ändern</button></span></div>`}
function bestNote(){const pk=new Set();S.games.forEach(g=>[g.sa,g.sb].forEach(x=>{if(x.type==='pick')pk.add(x.set)}));if(pk.has('q3vf'))return' Dazu die 2 besten Gruppendritten aus allen Gruppen.';if(pk.has('q3hf'))return' Dazu der beste Gruppenzweite aus allen Gruppen.';const b=[];S.games.forEach(g=>[g.sa,g.sb].forEach(x=>{if(x.type==='best')b.push(x)}));if(!b.length)return'';const r=b[0].rank;return' Dazu '+(b.length===1?'der beste Gruppen'+(r===2?'zweite':'dritte'):'die '+b.length+' besten Gruppen'+(r===2?'zweiten':'dritten'))+' aus allen Gruppen.'}
function standingsCards(compact){

  const st=standings(gr.key),q=qualifiers(gr.key);
  const rows=st.map((r,i)=>`<tr class="${i<q?'q':''}"><td class="pos">${i+1}</td><td class="tn">${esc(tname(r.id))}${!compact&&players(r.id)?`<div class="pl">${esc(players(r.id))}</div>`:''}</td><td>${r.sp}</td><td>${r.s}</td>${compact?'':`<td>${r.n}</td><td>${r.bp}:${r.bm}</td>`}<td>${r.bp-r.bm>0?'+':''}${r.bp-r.bm}</td></tr>`).join('');

 }).join('');

function kgCard(g,P){const A=side(g,'a'),B=side(g,'b'),d=g.status==='done',p=P[g.id];
 const ln=(x,h,w)=>`<div class="ln"><span class="${x.known?(d?(w?'win':'los'):''):'ph'}">${esc(x.name)}</span><span class="res">${d?h:''}</span></div>`;
 return`<div class="kg"><div class="tag" style="display:flex;justify-content:space-between"><span>${esc(g.label)}</span><span class="time">${g.status==='live'?'läuft':d?'':(p?'ca. '+fmt(p.start):'')}</span></div>${ln(A,g.hA,g.win==='a')}${ln(B,g.hB,g.win==='b')}</div>`}
function koCard(P){const ko=S.games.filter(g=>g.phase==='ko');if(!ko.length)return'';return`<div class="card"><h2>Finalrunde</h2>${ko.map(g=>kgCard(g,P)).join('')}</div>`}
function scheduleRows(P,last){
 const gs=S.games.filter(g=>g.phase==='group');const st=x=>P[x.id]?P[x.id].start:null,en=x=>P[x.id]?P[x.id].end:null;
 const mn=a=>Math.min(...a.map(st).filter(v=>v!=null)),mx=a=>Math.max(...a.map(en).filter(v=>v!=null));
 const rows=[['Turnierbeginn',S.settings.start+' Uhr']];
 if(gs.length)rows.push([S.settings.system==='groups'?'Gruppenphase':'Jeder gegen jeden',`${fmt(mn(gs))} bis ca. ${fmt(mx(gs))} Uhr`]);
 ['VF','HF','P3','F'].forEach(r=>{const k=S.games.filter(g=>g.round===r);if(k.length)rows.push([ROUND[r],'ca. '+fmt(mn(k))+' Uhr'])});
 rows.push(['Siegerehrung mit Pokal','ca. '+fmt(last+5*6e4)+' Uhr']);
 return`<div class="sched">${rows.map(r=>`<span>${esc(r[0])}</span><span>${esc(r[1])}</span>`).join('')}</div>`;
}
function planRow(g,P){
 const A=side(g,'a'),B=side(g,'b'),p=P[g.id],d=g.status==='done';
 const time=d?fmt(g.startedAt||g.finishedAt):g.status==='live'?'<span class="dot"></span>läuft':(p?'ca. '+fmt(p.start):'');
 const tbl=(g.status!=='open'&&g.table!=null)?'Tisch '+(g.table+1):(p&&p.table!=null?'Tisch '+(p.table+1):'');
 let acts='';
 if(g.status==='open'){if(!canStart(g))acts+=`<button class="btn sm gold" data-act="start" data-id="${g.id}">Starten</button>`;if(A.known&&B.known)acts+=`<button class="btn sm" data-act="result" data-id="${g.id}">Ergebnis</button>`}
 else if(g.status==='live')acts=`<button class="btn sm primary" data-act="result" data-id="${g.id}">Ergebnis</button>`;
 else acts=`<button class="btn sm" data-act="result" data-id="${g.id}">Ändern</button>`;
 return`<div class="pr ${g.status}"><span class="time">${time}</span><span class="meta"><span class="tag">${esc(g.label)}</span>${tbl?`<div class="time">${tbl}</div>`:''}</span><span class="a">${pName(A,d?(g.win==='a'?'win':'los'):'')}</span><span class="c res">${d?g.hA+' : '+g.hB:'<span class="los">gegen</span>'}</span><span>${pName(B,d?(g.win==='b'?'win':'los'):'')}</span><span class="acts row admin" style="justify-content:flex-end">${acts}</span></div>`;
}

function splitNote(){const n=S.teams.length,m=String(S.settings.groupsMode);let t='Es gibt immer mindestens 2 Gruppen. Automatisch: unter 12 Teams 2 Gruppen, ab 12 Teams 4. 3 Gruppen ab 9 Teams, 4 Gruppen ab 8 Teams. ';if(n<4)return t+'Für Gruppen braucht ihr mindestens 4 Teams.';const sz=groupSplit(n,m),G=sz.length;if(m==='4'&&n<8)t+='4 Gruppen gehen erst ab 8 Teams, deshalb 2 Gruppen. ';if(m==='3'&&n<9)t+='3 Gruppen gehen erst ab 9 Teams, deshalb 2 Gruppen. ';t+='Aufteilung bei '+n+' Teams: '+sz.map((x,i)=>'Gruppe '+'ABCD'[i]+' mit '+x).join(', ')+'. ';let vf=S.settings.koStart==='VF';if(vf&&!vfPossible(G,sz)){vf=false;t+='Viertelfinale geht mit dieser Aufteilung nicht'+(G===2?' (jede Gruppe braucht 4 Teams, also ab 8 Teams)':'')+', deshalb Halbfinale. '}const who={2:{HF:'Erste und Zweite jeder Gruppe ins Halbfinale',VF:'die besten 4 jeder Gruppe ins Viertelfinale (über Kreuz)'},3:{HF:'die 3 Gruppensieger und der beste Zweite ins Halbfinale',VF:'Erste und Zweite jeder Gruppe und die 2 besten Dritten ins Viertelfinale'},4:{HF:'die 4 Gruppensieger ins Halbfinale',VF:'Erste und Zweite jeder Gruppe ins Viertelfinale'}}[G][vf?'VF':'HF'];return t+'Weiter kommen '+who+'.'+(vf?' Teams aus derselben Gruppe treffen im Viertelfinale nicht aufeinander.':'')}

    <div><label class="f">Planzeit pro Spiel (Min.)</label><input type="number" min="3" max="60" data-set="gameMin" value="${s.gameMin}"></div>
    <div><label class="f">Wechselpause (Min.)</label><input type="number" min="0" max="30" data-set="pauseMin" value="${s.pauseMin}"></div>
    <div><label class="f">Zeitlimit</label><div class="seg"><button data-act="set" data-k="limitOn" data-v="1" class="${s.limitOn?'on':''}">An</button><button data-act="set" data-k="limitOn" data-v="0" class="${s.limitOn?'':'on'}">Aus</button></div></div>
    <div><label class="f">Zeitlimit (Min.)</label><input type="number" min="3" max="60" data-set="limitMin" value="${s.limitMin}" ${s.limitOn?'':'disabled'}></div>
   </div>
   <div class="note">Alle Werte lassen sich auch während des Abends ändern, der Zeitplan rechnet sofort neu. Tipp: Planzeit etwa so lang wie das Zeitlimit wählen.</div></div>
  <div class="card"><h2>Backup</h2>
   <div class="row"><button class="btn" data-act="exportDl">Backup herunterladen</button><button class="btn" data-act="exportCopy">Backup kopieren</button></div>
   <label class="f" style="margin-top:12px">Backup wiederherstellen (Text einfügen)</label><textarea id="impTxt" style="min-height:80px" placeholder="Backup-Text hier einfügen"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" data-act="import">Wiederherstellen</button></div></div>
 </div></div>`;
}
function bindSetup(){
 document.querySelectorAll('[data-set]').forEach(el=>el.addEventListener('change',()=>{
  const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;
  if(el.type==='number'){v=Math.max(+el.min||0,Math.min(+el.max||999,Math.round(+v||0)))}
  if(k==='tables')v=+v;
  if(k==='start'&&!/^\d{1,2}:\d{2}$/.test(v))return;
  S.settings[k]=v;save();render();
 }));
 document.querySelectorAll('[data-team]').forEach(el=>el.addEventListener('input',()=>{const t=team(el.dataset.team);if(t){t[el.dataset.f]=el.value;save();if(el.dataset.f==='name')renderHeader()}}));
 const li=$('#logoIn');if(li)li.addEventListener('change',()=>{
  const f=li.files&&li.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const m=480,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save();render();toast('Logo übernommen.')};img.onerror=()=>toast('Das Bild konnte nicht gelesen werden.');img.src=r.result};
  r.readAsDataURL(f);
 });
}
function snow(){
 const el=$('#snow');if(!S.settings.snow){el.innerHTML='';return}if(el.childElementCount)return;
 let h='';for(let i=0;i<40;i++){const sz=2+Math.random()*4;h+=`<span class="flake" style="left:${(Math.random()*100).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;opacity:${(.25+Math.random()*.5).toFixed(2)};animation-duration:${(12+Math.random()*16).toFixed(1)}s;animation-delay:-${(Math.random()*25).toFixed(1)}s;--dx:${(Math.random()*80-40).toFixed(0)}px"></span>`}
 el.innerHTML=h;
}
function render(){
 document.body.classList.toggle('tv',tv);renderHeader();
 document.querySelectorAll('#nav [data-act="view"]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const v=tv?'live':view;
 $('#main').innerHTML=({live:vLive,plan:vPlan,table:vTable,rules:vRules,setup:vSetup})[v]();
 if(v==='setup')bindSetup();
 snow();tick(true);syncWake().then(()=>{const w=document.getElementById('wakeInfo');if(w)w.textContent=wakeText()});
}
function tick(fromRender){
 const now=Date.now();$('#clock').textContent=fmt(now);
 const s=S.settings;
 document.querySelectorAll('[data-timer]').forEach(el=>{const g=byId(el.dataset.timer);if(!g||g.status!=='live')return;
  if(s.limitOn){const rem=g.startedAt+s.limitMin*6e4-now;el.textContent=rem>=0?mmss(rem):'Zeit um · +'+mmss(-rem);el.classList.toggle('over',rem<0)}
  else{el.textContent=mmss(now-g.startedAt);el.classList.remove('over')}});
 if(s.limitOn)S.games.forEach(g=>{if(g.status==='live'&&!g.beeped&&now>g.startedAt+s.limitMin*6e4){g.beeped=true;save();if(s.sound)beep()}});
 if(!fromRender&&tcount%10===9)syncWake();
 if(!fromRender&&++tcount%20===0&&(tv||['live','plan','table'].includes(view))&&$('#modal').classList.contains('hidden'))render();
}

/* ---------- Klicks ---------- */
document.addEventListener('pointerdown',audio);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,id=b.dataset.id;
 switch(a){
  case'view':view=b.dataset.v;render();window.scrollTo(0,0);break;
  case'tv':tv=!tv;try{if(tv&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!tv&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(err){}render();break;
  case'start':startGame(id,b.dataset.table);break;
  case'result':openResult(id);break;
  case'cancel':confirmBox('Spiel abbrechen?','Das Spiel geht zurück in den Spielplan, die Uhr wird zurückgesetzt.','Abbrechen bestätigen',()=>{const g=byId(id);Object.assign(g,{status:'open',table:null,startedAt:null,beeped:false});save();render()});break;
  case'mstep':{const k=b.dataset.side==='a'?'hA':'hB';mstate[k]=Math.max(0,Math.min(S.settings.cups,mstate[k]+(+b.dataset.d)));if(mstate.hA!==mstate.hB)mstate.win=null;drawResult();break}
  case'mfull':{const k=b.dataset.side==='a'?'hA':'hB';mstate[k]=S.settings.cups;if(mstate.hA!==mstate.hB)mstate.win=null;drawResult();break}
  case'mwin':mstate.win=b.dataset.v;drawResult();break;
  case'msave':saveResult();break;
  case'mreset':resetResult();break;
  case'mclose':closeModal();break;
  case'cyes':{const fn=pendingConfirm;closeModal();if(fn)fn();break}
  case'addTeam':S.teams.push({id:uid(),name:'',p1:'',p2:''});save();render();{const ins=document.querySelectorAll('[data-f="name"]');if(ins.length)ins[ins.length-1].focus()}break;
  case'delTeam':S.teams=S.teams.filter(t=>t.id!==id);save();render();break;
  case'set':{if(S.drawn&&b.dataset.k==='system')return;let v=b.dataset.v;if(b.dataset.k==='cups')v=+v;if(b.dataset.k==='limitOn')v=v==='1';S.settings[b.dataset.k]=v;save();render();break}
  case'draw':draw();break;
  case'redraw':confirmBox('Neu auslosen?','Gruppen und Spielplan werden neu erstellt.','Neu auslosen',draw);break;
  case'resetRes':confirmBox('Turnier zurücksetzen?','Spielplan und alle Ergebnisse werden gelöscht. Teams, Einstellungen und Logo bleiben.','Zurücksetzen',()=>{S.games=[];S.groups=[];S.drawn=false;save();view='setup';render()});break;
  case'resetAll':confirmBox('Alles löschen?','Teams, Ergebnisse, Logo und eigene Regeln werden gelöscht.','Alles löschen',()=>{S=defState();save();view='setup';render()});break;
  case'hornTest':beep();break;
  case'logoDel':S.logo=null;save();render();break;
  case'exportDl':{let fr=true;try{fr=window.top!==window.self}catch(err){}if(fr){toast('Download geht in dieser Ansicht nicht. Bitte „Backup kopieren“ nutzen.');break}try{const bl=new Blob([exportJson()],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='beerpong-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup wird heruntergeladen.')}catch(err){toast('Download geht hier nicht. Bitte „Backup kopieren“ nutzen.')}break}
  case'exportCopy':{const txt=exportJson();const fb=()=>modal(`<h2>Backup</h2><p class="sub">Text markieren und kopieren.</p><textarea readonly style="min-height:220px">${esc(txt)}</textarea><div class="row mfoot"><span class="spacer"></span><button class="btn primary" data-act="mclose">Fertig</button></div>`);try{navigator.clipboard.writeText(txt).then(()=>toast('Backup kopiert.'),fb)}catch(err){fb()}break}
  case'import':{const t=$('#impTxt').value.trim();if(!t){toast('Bitte zuerst den Backup-Text einfügen.');return}try{const x=JSON.parse(t);if(!x||!x.settings)throw 0;S=normalize(x);save();view='live';render();toast('Backup wiederhergestellt.')}catch(err){toast('Das ist kein gültiges Backup.')}break}
  case'rulesEdit':modal(`<h2>Regeln bearbeiten</h2><p class="note">Eine Regel pro Zeile. {becher} und {zeit} werden automatisch durch die Becheranzahl und das Zeitlimit ersetzt.</p><textarea id="rulesTxt" style="min-height:320px">${esc(S.rules.join('\n'))}</textarea><div class="row mfoot"><button class="btn danger" data-act="rulesDef">Standard</button><span class="spacer"></span><button class="btn" data-act="mclose">Abbrechen</button><button class="btn primary" data-act="rulesSave">Speichern</button></div>`);break;
  case'rulesSave':{const l=$('#rulesTxt').value.split('\n').map(x=>x.trim()).filter(Boolean);S.rules=l.length?l:DEFAULT_RULES.slice();save();closeModal();render();break}
  case'rulesDef':$('#rulesTxt').value=DEFAULT_RULES.join('\n');break;
 }
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&tv){tv=false;render()}});
render();
setInterval(()=>tick(false),1000);
window.__bp={get S(){return S},project,generate,standings,resolve};
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('SW-Registrierung fehlgeschlagen:', e);
    });
  });
}
</script>
